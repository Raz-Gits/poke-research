name: daily-refresh

# Once a day: pull fresh TCGplayer prices, collect today's eBay active-listing
# snapshot (valuable cards first, within the free ~5k/day Browse quota), rebuild
# docs/data, and push so Netlify redeploys. The demand-pressure signal needs a
# few days of snapshots to accrue, then fills in automatically.
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily (~07:00 PT)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

# Let the job commit the refreshed data back to the repo.
permissions:
  contents: write

# Never let two daily runs overlap (they'd both spend eBay quota / race the push).
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch prices (pokemontcg.io + TCGdex)
        run: python -m pipeline.fetch

      - name: Build — collect eBay snapshot (valuable-first) + recompute everything
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: python -m pipeline.build

      - name: Append today's TCGplayer sealed-price point (Watchlists trend)
        continue-on-error: true   # optional trend feed must never block the core refresh
        run: python -m collectors.sealed_history

      - name: Commit & push refreshed data (triggers Netlify)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data data/snapshots data/normalized
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi
